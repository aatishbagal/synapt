name: CI

# The merge gate for pull requests into main, and a continuous check on dev.
# Compiles, lints, tests, and builds the frontend (debug build only, no
# bundling); releases are cut from main by release.yml.
#
# Unlike SynaptClip, this also runs on pushes to dev. Synapt builds for Linux
# and Windows only during a release, so without this nothing catches a
# platform-specific break until the release job is already publishing. Actions
# minutes are free on public repositories, so the check costs nothing.
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      # The Synapt app lives in this repo; synapt-core is a sibling repo that
      # src-tauri/Cargo.toml references via path = "../../synapt-core". Checking
      # both out side by side reproduces the local directory layout so the path
      # dependency resolves.
      - name: Checkout synapt
        uses: actions/checkout@v4
        with:
          path: synapt

      - name: Checkout synapt-core
        uses: actions/checkout@v4
        with:
          repository: aatishbagal/synapt-core
          ref: dev
          path: synapt-core
          # If synapt-core is PRIVATE, the default GITHUB_TOKEN cannot read it.
          # Create a fine-grained PAT with read access to synapt-core, store it
          # as a repo secret named SYNAPT_CORE_TOKEN, and uncomment the next line.
          # token: ${{ secrets.SYNAPT_CORE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test core release coordination
        working-directory: synapt
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libxdo-dev \
            file \
            wget

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: synapt/package-lock.json

      - name: Set up Rust
        # Pinned for reproducible clippy: floating @stable lets new clippy
        # releases introduce lints that break -D warnings with no code change.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: synapt/src-tauri

      - name: Install frontend dependencies
        working-directory: synapt
        run: npm ci

      # Cargo.toml accepts any compatible core (^0.2.x), and core/dev may already
      # carry a newer patch than Cargo.lock records. Resolving without --locked
      # rewrites only the synapt-core version line (cargo update would re-resolve
      # unrelated crates), so the --locked steps below check against core/dev.
      - name: Refresh the synapt-core lock entry
        working-directory: synapt/src-tauri
        run: cargo metadata --format-version 1 > /dev/null

      - name: Clippy
        working-directory: synapt/src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Test
        working-directory: synapt/src-tauri
        run: cargo test --locked

      - name: Frontend build
        working-directory: synapt
        run: npm run build

      - name: Debug build
        working-directory: synapt/src-tauri
        run: cargo build --locked
